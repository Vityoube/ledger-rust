[package]
name = "tech-task-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
ureq = "3.4.2"

[lib]
name = "ledger"
path = "src/lib.rs"

[[bin]]
name = "tech-task-rust"
path = "src/main.rs"
